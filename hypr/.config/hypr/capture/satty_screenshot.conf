# Normal Screenshots
bind = , Print, exec, ~/.config/satty/scripts/shot_display.sh
bind = SUPER, Print, exec, ~/.config/satty/scripts/shot_window.sh
bind = SHIFT, Print, exec,  ~/.config/satty/scripts/shot_region.sh

# Clipboard Screenshots
bind = CTRL, Print, exec, ~/.config/satty/scripts/shot_display_clipboard.sh
bind = CTRL+SUPER, Print, exec, ~/.config/satty/scripts/shot_window_clipboard.sh
bind = CTRL+SHIFT, Print, exec,  ~/.config/satty/scripts/shot_region_clipboard.sh

